let pinSubmitting = false;
function atualizarPinBoxes(val){
  const container = document.getElementById('pinBoxes');
  if(!container) return;
  const n = Math.max(val.length, 4); // sempre mostra pelo menos 4 espaços de guia
  let html = '';
  for(let i=0;i<n;i++){
    html += `<div class="pin-box${i<val.length?' filled':''}${i===val.length?' active':''}"></div>`;
  }
  container.innerHTML = html;
}
async function handlePinInput(rawVal){
  const val = rawVal.replace(/[^a-zA-Z0-9]/g,'').slice(0,24);
  pinCurrentValue = val;
  atualizarPinBoxes(val);
}
function submitPinManually(){
  const inp = document.getElementById('pinInput');
  const val = inp ? inp.value.replace(/[^a-zA-Z0-9]/g,'').slice(0,24) : '';
  if(val.length<4){
    const err = document.getElementById('lockError');
    if(err) err.textContent = 'Digite pelo menos 4 caracteres.';
    return;
  }
  if(!pinSubmitting){
    pinSubmitting = true;
    handlePinComplete(val).finally(()=>{ pinSubmitting = false; });
  }
}
async function handlePinComplete(val){
  if(pinStage==='setup'){
    pinFirstEntry = val;
    pinCurrentValue = '';
    pinStage = 'setup-confirm';
    renderLockScreen();
  }else if(pinStage==='setup-confirm'){
    if(val === pinFirstEntry){
      pendingPinValue = val;
      pinCurrentValue = '';
      pinStage = 'setup-question';
      renderLockScreen();
    }else{
      pinCurrentValue = '';
      pinFirstEntry = '';
      pinStage = 'setup';
      renderLockScreen();
      const err = document.getElementById('lockError');
      if(err) err.textContent = 'Os PINs não coincidem. Tente novamente.';
    }
  }else{
    const hash = await sha256Hex(val);
    const stored = getStoredPinHash();
    if(hash === stored){
      if(appJaInicializado){
        desbloquearAppSemRecarregar();
      }else{
        unlockApp();
      }
    }else{
      pinCurrentValue = '';
      renderLockScreen();
      const err = document.getElementById('lockError');
      if(err) err.textContent = 'PIN incorreto. Tente novamente.';
    }
  }
}
async function finishPinSetup(){
  const q = document.getElementById('secQInput').value.trim();
  const a = document.getElementById('secAnswerInput').value;
  if(!q){
    document.getElementById('lockError').textContent = 'Escreva sua pergunta antes de continuar.';
    return;
  }
  if(!normalizeAnswer(a)){
    document.getElementById('lockError').textContent = 'Digite uma resposta antes de continuar.';
    return;
  }
  const pinHash = await sha256Hex(pendingPinValue);
  const answerHash = await sha256Hex(normalizeAnswer(a));
  setStoredPinHash(pinHash);
  setStoredSecQuestion(q);
  setStoredSecAnswerHash(answerHash);
  pendingPinValue = '';
  unlockApp();
}
function forgotPin(){
  const question = getStoredSecQuestion();
  if(!question){
    // Legacy/edge case: no security question was ever configured for this PIN.
    confirmAction('Não há pergunta de segurança configurada. Redefinir o PIN agora mesmo assim?', ()=>{
      clearStoredPinHash();
      pinStage = 'setup';
      pinCurrentValue = '';
      pinFirstEntry = '';
      renderLockScreen();
    });
    return;
  }
  pinStage = 'forgot-question';
  renderLockScreen();
}
async function checkForgotAnswer(){
  const inp = document.getElementById('secAnswerCheckInput');
  const val = inp ? inp.value : '';
  const hash = await sha256Hex(normalizeAnswer(val));
  const stored = getStoredSecAnswerHash();
  if(hash === stored){
    clearStoredPinHash();
    pinStage = 'setup';
    pinCurrentValue = '';
    pinFirstEntry = '';
    toast('Resposta correta. Crie um novo PIN.');
    renderLockScreen();
  }else{
    const err = document.getElementById('lockError');
    if(err) err.textContent = 'Resposta incorreta.';
    if(inp) inp.value = '';
  }
}
function cancelForgot(){
  pinStage = 'enter';
  pinCurrentValue = '';
  renderLockScreen();
}
function unlockApp(){
  const lockEl = document.getElementById('lockScreen');
  const shellEl = document.querySelector('.app-shell');
  if(lockEl) lockEl.innerHTML = '';
  if(shellEl) shellEl.style.display = '';
  initApp();
  appJaInicializado = true;
  reiniciarTimerInatividade();
}
let appJaInicializado = false;
function desbloquearAppSemRecarregar(){
  const lockEl = document.getElementById('lockScreen');
  const shellEl = document.querySelector('.app-shell');
  if(lockEl) lockEl.innerHTML = '';
  if(shellEl) shellEl.style.display = '';
  reiniciarTimerInatividade();
}
function startLockGate(){
  const stored = getStoredPinHash();
  pinStage = stored ? 'enter' : 'setup';
  pinCurrentValue = '';
  renderLockScreen();
}

/* ===================== INIT ===================== */
function getAniversariantesHoje(){
  const hoje = new Date();
  const hojeStr = String(hoje.getDate()).padStart(2,'0') + '/' + String(hoje.getMonth()+1).padStart(2,'0');
  const lista = [];
  clientesIndex.forEach(c=>{
    if(c.proprietario && formatAnivDisplay(c.anivProp) === hojeStr){
      lista.push({cliente:c.cliente, pessoa:c.proprietario, papel:'Proprietário'});
    }
    if(c.administrador && formatAnivDisplay(c.anivAdm) === hojeStr){
      lista.push({cliente:c.cliente, pessoa:c.administrador, papel:'Administrador'});
    }
  });
  return lista;
}
function renderAniversarioBanner(){
  const el = document.getElementById('aniversarioBanner');
  if(!el) return;
  const lista = getAniversariantesHoje();
  if(!lista.length){ el.innerHTML=''; return; }
  el.innerHTML = `
    <div class="aniversario-banner">
      🎉 Aniversário hoje: ${lista.map(a=>`<strong>${esc(a.pessoa)}</strong> (${esc(a.papel)} — ${esc(a.cliente)})`).join(' &nbsp;·&nbsp; ')}
    </div>
  `;
}

function mostrarDialogoPrimeiraInstalacao(){
  openModal(`
    <div class="modal-box">
      <p style="font-weight:700;margin-bottom:8px;">Primeira vez neste aparelho</p>
      <p style="font-size:var(--font-body);margin-bottom:6px;font-weight:600;">Nenhuma base carregada. Use o botão de atualizar (planilha Excel)</p>
      <p style="font-size:var(--font-body);margin-bottom:16px;">Ainda não há nenhum cliente cadastrado aqui. Como você quer começar?</p>
      <div class="form-actions" style="flex-direction:column;align-items:stretch;gap:8px;margin-top:0;">
        <label class="btn btn-accent" style="cursor:pointer;text-align:center;justify-content:center;">
          📊 Carregar Planilha Excel (.xlsx)
          <input type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="closeModal(); importarPlanilhaClientes(event);">
        </label>
        <label class="btn btn-outline" style="cursor:pointer;text-align:center;justify-content:center;">
          Importar Backup (.json)
          <input type="file" style="display:none" onchange="closeModal(); importarDadosFile(event);">
        </label>
        <button class="btn btn-outline" onclick="comecarVazioPrimeiraInstalacao()">Começar Vazio</button>
      </div>
    </div>
  `);
}
async function comecarVazioPrimeiraInstalacao(){
  await storeSet('clientes-index', JSON.stringify(clientesIndex));
  closeModal();
  toast('Pronto para começar.');
}

async function initApp(){
  renderTabs();
  document.getElementById('content').innerHTML = '<div class="card"><div class="empty-state">Carregando…</div></div>';
  await migrarStorageAntigoSeNecessario();
  await ensureSeededListasAuxiliares();
  const idleInp = document.getElementById('idleMinutosInput');
  if(idleInp) idleInp.value = getInatividadeMinutos();
  renderAniversarioBanner();
  renderContent();
  if(ehPrimeiraInstalacao){
    mostrarDialogoPrimeiraInstalacao();
  }
}
/* ===================== TRAVAR SOZINHO AO SAIR DE FOCO ===================== */
let suprimirProximoBloqueio = false;
function bloquearAppPorInatividade(){
  const stored = getStoredPinHash();
  if(!stored) return; // sem PIN configurado, nada a proteger
  const shellEl = document.querySelector('.app-shell');
  if(!shellEl || shellEl.style.display === 'none') return; // já está travado
  pinStage = 'enter';
  pinCurrentValue = '';
  shellEl.style.display = 'none';
  renderLockScreen();
}
/* Trava também depois de X minutos sem nenhuma ação (mesmo que o app fique
   aberto na tela, sem trocar de aplicativo). X é configurável no topo do app. */
let inatividadeTimer = null;
const IDLE_MINUTOS_KEY = 'idle-minutos';
function getInatividadeMinutos(){
  try{
    const v = parseInt(localStorage.getItem(STORAGE_PREFIX+IDLE_MINUTOS_KEY), 10);
    return (v && v>0) ? v : 10;
  }catch(e){ return 10; }
}
function atualizarInatividadeMinutos(v){
  const n = parseInt(v, 10);
  if(!n || n<1){
    toast('Digite um número válido de minutos (mínimo 1).');
    const inp = document.getElementById('idleMinutosInput');
    if(inp) inp.value = getInatividadeMinutos();
    return;
  }
  try{ localStorage.setItem(STORAGE_PREFIX+IDLE_MINUTOS_KEY, String(n)); }catch(e){}
  toast('Tempo de fechamento automático atualizado para ' + n + ' minuto(s).');
  reiniciarTimerInatividade();
}
function reiniciarTimerInatividade(){
  clearTimeout(inatividadeTimer);
  if(!getStoredPinHash()) return; // sem PIN, não precisa rastrear
  inatividadeTimer = setTimeout(bloquearAppPorInatividade, getInatividadeMinutos() * 60 * 1000);
}
['click','keydown','touchstart','scroll','mousemove'].forEach(evt=>{
  document.addEventListener(evt, reiniciarTimerInatividade, {passive:true});
});
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'hidden'){
    if(suprimirProximoBloqueio){
      suprimirProximoBloqueio = false;
      return;
    }
    bloquearAppPorInatividade();
  }
});
/* Não trava quando o próprio app abre um seletor de foto/arquivo nativo
   (câmera, galeria, escolher planilha/backup) — isso também "esconde" a página
   por um instante, mas é uma ação intencional, não alguém saindo do app. */
document.addEventListener('click', function(e){
  let el = e.target;
  while(el && el.nodeType===1 && el!==document.body){
    if(el.tagName==='INPUT' && el.type==='file'){ suprimirProximoBloqueio = true; return; }
    if(el.tagName==='LABEL' && el.querySelector && el.querySelector('input[type="file"]')){ suprimirProximoBloqueio = true; return; }
    el = el.parentElement;
  }
}, true);

startLockGate();
</script>
